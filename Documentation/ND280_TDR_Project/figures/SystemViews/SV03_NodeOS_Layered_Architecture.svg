<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="980" viewBox="0 0 1300 980">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4A5560"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="650.0" y="48" font-family="Liberation Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#25313C">SV-03  NodeOS Layered Architecture</text>
<text x="120" y="170" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#2E7D32">Hardware</text>
<text x="120" y="193" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#2E7D32">Independent</text>
<line x1="120" y1="245" x2="120" y2="815" stroke="#4A5560" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<text x="120" y="860" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#4F81BD">Hardware</text>
<text x="120" y="883" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#4F81BD">Dependent</text>
<rect x="230" y="125" width="760" height="120" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
<text x="610.0" y="159" font-family="Liberation Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#25313C">Application</text>
<text x="610.0" y="191" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#3F4A53">Acquisition sequence | System state | Command dispatch</text>
<rect x="230" y="270" width="760" height="150" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
<text x="610.0" y="304" font-family="Liberation Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#25313C">Core Services</text>
<text x="610.0" y="336" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#3F4A53">Measurement | Calibration | Diagnostics | Communication</text>
<rect x="230" y="445" width="760" height="165" rx="16" fill="#EAF2F8" stroke="#4F81BD" stroke-width="3"/>
<text x="610.0" y="479" font-family="Liberation Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#25313C">Platform Services</text>
<text x="610.0" y="511" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#3F4A53">TMAG5273 | EEPROM | UART | TWI0 | TWI1 | Watchdog | Timer | GPIO</text>
<rect x="230" y="635" width="760" height="100" rx="16" fill="#EAF2F8" stroke="#4F81BD" stroke-width="3"/>
<text x="610.0" y="669" font-family="Liberation Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#25313C">Hardware Abstraction Layer</text>
<text x="610.0" y="701" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#3F4A53">Microcontroller-dependent access and register isolation</text>
<rect x="230" y="770" width="760" height="90" rx="16" fill="#F1F1F1" stroke="#616161" stroke-width="3"/>
<text x="610.0" y="804" font-family="Liberation Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#25313C">ATmega328PB</text>
<text x="610.0" y="836" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#3F4A53">Physical MCU and peripherals</text>
<line x1="610" y1="245" x2="610" y2="270" stroke="#4A5560" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<line x1="610" y1="420" x2="610" y2="445" stroke="#4A5560" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<line x1="610" y1="610" x2="610" y2="635" stroke="#4A5560" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<line x1="610" y1="735" x2="610" y2="770" stroke="#4A5560" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="1025" y="215" width="240" height="330" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
<text x="1145.0" y="249" font-family="Liberation Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#25313C">NodeOS Responsibilities</text>
<text x="1145.0" y="281" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#3F4A53">Measurement</text>
<text x="1145.0" y="303" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#3F4A53">Calibration</text>
<text x="1145.0" y="325" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#3F4A53">Diagnostics</text>
<text x="1145.0" y="347" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#3F4A53">Communication</text>
<text x="1145.0" y="369" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#3F4A53">Configuration</text>
<text x="1145.0" y="391" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#3F4A53">Fault recovery</text>
<text x="610" y="925" font-family="Liberation Sans,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#25313C">Design rule: the application layer never directly accesses hardware resources.</text>
</svg>